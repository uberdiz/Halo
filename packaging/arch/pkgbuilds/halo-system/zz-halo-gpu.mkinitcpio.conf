# Halo OS (mkinitcpio drop-in, zz- so it is read after /etc/mkinitcpio.conf): on a PC with an NVIDIA GPU, no GPU driver
# goes into the initramfs (no "kms" hook). The kms hook would put nouveau there, and the initramfs loads it
# before Halo's boot-time choice between nvidia-open and nouveau (halo-gpu-detect.service) can run. The
# driver then loads from the root file system a second later; the boot splash uses the firmware's
# framebuffer until then. PCs without an NVIDIA GPU keep early KMS. A new initramfs is built on every
# kernel update, so an added or removed NVIDIA card is picked up then.
for _halo_d in /sys/bus/pci/devices/*; do
  if [[ "$(< "$_halo_d/vendor")" == 0x10de && "$(< "$_halo_d/class")" == 0x030[02]* ]]; then
    _halo_hooks=()
    for _halo_h in "${HOOKS[@]}"; do
      [[ "$_halo_h" == kms ]] || _halo_hooks+=("$_halo_h")
    done
    HOOKS=("${_halo_hooks[@]}")
    break
  fi
done 2>/dev/null
unset _halo_d _halo_h _halo_hooks
