# HalOS: replaces nvidia-utils' /usr/lib/modprobe.d/nvidia-utils.conf (same name in /etc wins), which
# blacklists nouveau on every PC. Halo blacklists nouveau only when this PC's NVIDIA GPU is one nvidia-open
# drives; older NVIDIA GPUs keep nouveau. The choice is made at each boot: /usr/lib/halo/gpu-detect writes
# /run/modprobe.d/halo-gpu.conf.
#
# Wayland needs NVIDIA's kernel mode setting and its framebuffer console (options only apply when it loads).
options nvidia_drm modeset=1 fbdev=1
