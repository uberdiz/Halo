# HalOS sound defaults (halo-system), WirePlumber 0.5. Change them for one user in
# ~/.config/wireplumber/wireplumber.conf.d/ (same keys; a later file wins).

wireplumber.settings = {
  # A Bluetooth headset drops to the headset profile (HSP/HFP: mono, 16 kHz, choppy) whenever any app records
  # from it, and SAINT's microphone listens all the time, so it never came back to A2DP. Stay on A2DP; pick
  # "Headset" for a call in Settings › Sound (SAINT) or the Plasma sound applet.
  bluetooth.autoswitch-to-headset-profile = false
}

monitor.bluez.properties = {
  # Best codec the headphones support wins (LDAC > aptX HD > aptX > AAC > SBC-XQ > SBC); SBC-XQ and mSBC are
  # off upstream because a few old devices mishandle them.
  bluez5.enable-sbc-xq = true
  bluez5.enable-msbc = true
  bluez5.enable-hw-volume = true
  bluez5.a2dp.ldac.quality = "auto"
}

monitor.bluez.rules = [
  {
    # Bluetooth outputs: ask for a bigger buffer (1024 frames, ~21 ms) so radio hiccups don't become underruns,
    # and don't suspend them (waking costs the first second of every sound).
    matches = [ { node.name = "~bluez_output.*" } ]
    actions = { update-props = { node.latency = "1024/48000", session.suspend-timeout-seconds = 0 } }
  }
]

monitor.alsa.rules = [
  {
    # NVIDIA GPU audio: the monitor's speakers over HDMI / DisplayPort. Never disabled, and with ACP so every
    # HDMI/DP output is a profile. When the monitor's ELD isn't read (screen asleep at boot, some nvidia-open
    # releases) every HDMI profile says "unavailable" and WirePlumber picks "off": no output at all. SAINT's
    # Settings › Sound lists those profiles anyway and audio.repair turns one on; WirePlumber remembers that
    # choice (device.restore-profile, on by default).
    matches = [ { device.name = "~alsa_card.*", device.vendor.id = "0x10de" } ]
    actions = { update-props = { device.disabled = false, api.alsa.use-acp = true, api.acp.auto-profile = true,
                                 api.acp.auto-port = true } }
  }
  {
    # HDMI / DisplayPort outputs (any GPU): stay open while idle; monitors mute for 1-2 s when one reopens.
    matches = [ { node.name = "~alsa_output.*hdmi*" } ]
    actions = { update-props = { session.suspend-timeout-seconds = 0 } }
  }
]
