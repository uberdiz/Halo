# Halo installer (Calamares 3.3).
---
modules-search: [ local, /usr/lib/calamares/modules ]

instances:
- id: halo-cleanup
  module: shellprocess
  config: shellprocess-halo-cleanup.conf
- id: halo-signedboot
  module: shellprocess
  config: shellprocess-halo-signedboot.conf
- id: halo-secureboot
  module: shellprocess
  config: shellprocess-halo-secureboot.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - shellprocess@halo-cleanup
  - services-systemd
  - initcpiocfg
  - initcpio
  - grubcfg
  - bootloader
  - shellprocess@halo-signedboot
  - shellprocess@halo-secureboot
  - umount
- show:
  - finished

branding: halo
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: true
quit-at-end: false
