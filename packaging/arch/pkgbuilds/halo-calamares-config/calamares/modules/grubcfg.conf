# GRUB shows Windows (os-prober) and remembers the last choice; "Restart into Windows" in SAINT's
# Recovery page uses grub-reboot (plan §7).
---
overwrite: false
keepDistributor: false
prefer_grub_d: false
always_use_defaults: true
# Quiet boot behind the HalOS splash (Plymouth); kernel and udev messages only when something is wrong.
kernel_params: ["quiet", "splash", "loglevel=3", "rd.udev.log_level=3", "vt.global_cursor_default=0",
                "nowatchdog"]
defaults:
    # 5 seconds while another system (Windows) is on the menu. With HalOS alone, halo-secureboot sets 0 and a
    # hidden menu afterwards (hold Shift or press Esc while starting to see it).
    GRUB_TIMEOUT: 5
    # Not "saved": GRUB can't write grubenv on Btrfs, which stops every boot at "sparse file not allowed / Press any key".
    GRUB_DEFAULT: "0"
    GRUB_SAVEDEFAULT: false
    GRUB_DISABLE_SUBMENU: true
    GRUB_TERMINAL_OUTPUT: "console"
    GRUB_DISABLE_RECOVERY: true
    GRUB_DISABLE_OS_PROBER: false
