# GPT + an EFI partition + Btrfs. Kernels and initramfs (large with nvidia) live in /boot on the Btrfs
# root, never on the EFI partition: it only holds shim, MokManager and GRUB (~15 MB, halo-secureboot). So an
# existing small EFI partition, like the 100 MB one Windows makes, can be reused as-is (mounted at /boot/efi,
# not formatted); a new one is made at the recommended size.
# Calamares itself refuses to shrink BitLocker-encrypted partitions; suspend BitLocker in Windows first.
#
# This page is the advanced path only. "Install HalOS" first offers core/install_target.py (settings-freespace.conf),
# which makes a dedicated EFI partition in free space and never comes here. On this page, never pick a HALOLIVE
# partition as the EFI partition: it's the live medium, ESP-typed so firmware can start it. Docs: DUAL_BOOT_INSTALLATION.md.
---
efi:
    mountPoint: "/boot/efi"
    recommendedSize: 512MiB
    minimumSize: 64MiB
    label: "EFI"

defaultPartitionTableType: gpt
requiredPartitionTableType: [ gpt, msdos ]

userSwapChoices:
    - none
    - file
initialSwapChoice: none

drawNestedPartitions: false
alwaysShowPartitionLabels: true
allowManualPartitioning: true
initialPartitioningChoice: none

defaultFileSystemType: "btrfs"
availableFileSystemTypes: [ "btrfs", "ext4", "xfs" ]

enableLuksAutomatedPartitioning: true
