---
efiBootLoader: "grub"
kernelSearchPath: "/boot"
kernelPattern: "^vmlinuz.*"
grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"
efiBootloaderId: "Halo"
# No fallback copy: on a dual-boot PC it would replace Windows' EFI/BOOT/BOOTX64.EFI. halo-secureboot
# writes the fallback itself when the EFI partition isn't shared with Windows.
installEFIFallback: false
