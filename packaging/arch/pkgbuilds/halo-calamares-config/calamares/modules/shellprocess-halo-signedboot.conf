---
# Outside the chroot: the live medium isn't visible inside it.
dontChroot: true
timeout: 60
script:
    - "mkdir -p ${ROOT}/var/lib/halo-signed-boot"
    - "cp /run/archiso/bootmnt/halo/boot/x86_64/grubx64-halo.efi /run/archiso/bootmnt/halo/boot/x86_64/vmlinuz-linux ${ROOT}/var/lib/halo-signed-boot/"
i18n:
    name: "Copying the signed boot files"
