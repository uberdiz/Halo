# The simple path has no Location or Keyboard page: they come from the live session (halo-autolocale), so the
# pages are Welcome (language), your account and the summary (the free space is chosen before, in the chooser).
# HalOS installer, "Install to free space" (core/install_target.py selects this file in the live session's RAM).
# Same as settings.conf except that Calamares's partition page and job are replaced by halotarget, which creates
# a new EFI partition and Btrfs root in the free region the user confirmed, and nothing else.
---
modules-search: [ local, /usr/lib/calamares/modules, /usr/lib/halo/calamares-modules ]

instances:
- id: halo-cleanup
  module: shellprocess
  config: shellprocess-halo-cleanup.conf
- id: halo-signedboot
  module: shellprocess
  config: shellprocess-halo-signedboot.conf
- id: halo-secureboot
  module: shellprocess
  config: shellprocess-halo-secureboot.conf
- id: halo-autolocale
  module: shellprocess
  config: shellprocess-halo-autolocale.conf
- id: halo
  module: halobootloader
  config: bootloader.conf

sequence:
- show:
  - welcome
  - users
  - summary
- exec:
  - halotarget
  - mount
  - unpackfs
  - machineid
  - fstab
  - shellprocess@halo-autolocale
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - shellprocess@halo-cleanup
  - services-systemd
  - initcpiocfg
  - initcpio
  - grubcfg
  - halobootloader@halo
  - shellprocess@halo-signedboot
  - shellprocess@halo-secureboot
  - umount
- show:
  - finished

branding: halo
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: true
quit-at-end: false
