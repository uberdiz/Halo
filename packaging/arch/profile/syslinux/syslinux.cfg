# Legacy BIOS boot: straight into Halo OS (no menu), like the UEFI entry.
DEFAULT halo
PROMPT 0
TIMEOUT 0

LABEL halo
    MENU LABEL Start Halo OS
    LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
    INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
    APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% copytoram=n cow_spacesize=50% quiet splash loglevel=3 rd.udev.log_level=3 vt.global_cursor_default=0

LABEL halo-basic
    MENU LABEL Start Halo OS in basic graphics mode
    LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
    INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
    APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% copytoram=n cow_spacesize=50% nomodeset halo.nvidia=0
