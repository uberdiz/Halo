# Live ISO initramfs (archiso hooks + the Halo boot splash). The installer deletes this file;
# installed systems get a normal initramfs from Calamares' initcpiocfg.
# No "kms" hook: it would load nouveau in the initramfs, before halo-gpu-detect.service has chosen between
# nvidia-open and nouveau. GPU drivers load from the image instead; the splash uses the firmware framebuffer.
HOOKS=(base udev microcode modconf plymouth memdisk archiso archiso_loop_mnt block filesystems keyboard)
# zstd: builds in seconds (xz -9e took minutes) and decompresses faster at boot.
COMPRESSION="zstd"
COMPRESSION_OPTIONS=(-T0 -10)
