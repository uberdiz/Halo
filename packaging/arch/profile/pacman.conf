# pacman.conf used by mkarchiso to install the image (build_iso.sh fills in @HALO_REPO@ and @SERVER@).
# The installed system gets Arch's own /etc/pacman.conf from the pacman package, not this file.
[options]
HoldPkg     = pacman glibc
Architecture = auto
CheckSpace
ParallelDownloads = 5
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

# Halo's own packages (SAINT, branding, installer config) and the AUR packages built for this ISO.
# Built locally in the same run, so they're trusted by path rather than signature.
[halo]
SigLevel = Optional TrustAll
Server = file://@HALO_REPO@

[core]
Server = @SERVER@

[extra]
Server = @SERVER@

# 32-bit libraries: lib32-nvidia-utils (Steam, Wine). Installed systems get [multilib] turned on in
# /etc/pacman.conf by halo-branding (apply-branding).
[multilib]
Server = @SERVER@
