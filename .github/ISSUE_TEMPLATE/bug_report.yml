name: Bug report
description: Something in HalOS or SAINT doesn't work
labels: [bug]
body:
  - type: input
    id: version
    attributes: {label: HalOS version, placeholder: "v2.1.0-beta.1 (cat /etc/halo/version)"}
    validations: {required: true}
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Install / Setup.exe, Boot / Secure Boot, Graphics / NVIDIA, SAINT assistant, Voice, Avatar, Visual Shop, Store, System Overview, Other]
    validations: {required: true}
  - type: textarea
    id: hw
    attributes: {label: Hardware, description: "CPU, GPU, RAM, laptop/desktop, dual boot?"}
  - type: textarea
    id: what
    attributes: {label: What happened and what you expected, description: Steps to reproduce}
    validations: {required: true}
  - type: textarea
    id: logs
    attributes: {label: Logs, description: "Installer 'Copy log', or journalctl --user -u saint, journalctl -b -p err", render: text}
