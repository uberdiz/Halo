# Builds the SAINT iPhone app (mobile/ios) on GitHub's macOS machines (iOS apps can only be compiled on a Mac),
# runs the SaintCore tests, and attaches an UNSIGNED .ipa that you sign and install from Windows with Sideloadly
# or AltStore (they use your own Apple ID). See mobile/docs/IPHONE_SETUP.md.
#
# Compiler and test errors are also written as annotations on the run, so they can be read without downloading logs.
name: iOS app

on:
  push:
    paths: ["mobile/ios/**", "tests/data/remote_vectors.json", ".github/workflows/mobile-ios.yml"]
  pull_request:
    paths: ["mobile/ios/**", "tests/data/remote_vectors.json", ".github/workflows/mobile-ios.yml"]
  workflow_dispatch:
  release:
    types: [published]            # a HalOS release gets the iPhone app attached (SaintMobile-unsigned.ipa)

defaults:
  run:
    working-directory: mobile/ios

jobs:
  test:
    name: SaintCore tests (macOS)
    runs-on: macos-15
    timeout-minutes: 12             # a test run takes ~1 min; a hung simulator/socket test must not block for hours
    steps:
      - uses: actions/checkout@v4
      - name: Versions
        run: swift --version && xcodebuild -version
      - name: swift test
        run: |
          set -o pipefail
          # one retry: an occasional hang (seen 2026-11-12, same commit passed in 1 min on main) is not a failure
          T() { perl -e 'alarm shift; exec @ARGV' 300 swift test 2>&1; }      # macOS has no timeout(1)
          (T || T) | tee test.log | tail -n 80
      - name: Report problems
        if: failure()
        run: |
          grep -E "error:|failed|Fatal error|Crash" test.log | sed -E 's#/Users/runner/work/[^/]+/[^/]+/mobile/ios/##' | head -n 150 > problems.txt || true
          MSG=$(python3 -c "import sys,urllib.parse; t=open('problems.txt').read()[:60000]; print(t.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))")
          echo "::error title=SaintCore test problems::${MSG}"

  ipa:
    name: Build unsigned .ipa
    runs-on: macos-15
    permissions:
      contents: write               # only used to attach the .ipa to a published release
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the Xcode project
        run: xcodegen generate
      - name: Build (no code signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project SaintMobile.xcodeproj \
            -scheme SaintMobile \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | tail -n 60
      - name: Report compiler errors
        if: failure()
        run: |
          grep -E "error:|fatal error:" build.log | sed -E 's#/Users/runner/work/[^/]+/[^/]+/mobile/ios/##' | awk '!seen[$0]++' | head -n 150 > problems.txt || true
          MSG=$(python3 -c "t=open('problems.txt').read()[:60000]; print(t.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))")
          echo "::error title=Swift compiler errors::${MSG}"
      - name: Package the .ipa
        run: |
          APP=$(find build/Build/Products -maxdepth 3 -name "*.app" | head -n 1)
          echo "app: $APP"
          rm -rf Payload && mkdir Payload && cp -R "$APP" Payload/
          zip -qry SaintMobile-unsigned.ipa Payload
          ls -lh SaintMobile-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: SaintMobile-unsigned-ipa
          path: mobile/ios/SaintMobile-unsigned.ipa
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: mobile/ios/build.log
      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" SaintMobile-unsigned.ipa --clobber
